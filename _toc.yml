# Book structure for Jupyter Book
# Each YAML entry corresponds to a markdown (`.md`) or notebook (`.ipynb`)
# file in your repo (without the extension).

format: jb-book
root: intro ## landing page

chapters:
  - file: chapters/preface
    title: Preface

  - file: chapters/navigating_the_book/index
    title: Navigating the book
    sections:
      - file: chapters/navigating_the_book/navigation

  - file: chapters/what_is_ecological_economics/index
    title: What Is Ecological Economics?

  - file: chapters/intro_python/index
    title: Introduction to Python and Programming
    sections:
      - file: chapters/intro_python/install_python
      - file: chapters/intro_python/calculator
      - file: chapters/intro_python/variables
      - file: chapters/intro_python/ifs_and_loops
      - file: chapters/intro_python/functions
      - file: chapters/intro_python/algorithms
      - file: chapters/intro_python/classes
      - file: chapters/intro_python/small_programming_project

  - file: chapters/order_of_magnitude_economics_and_scaling/index
    title: Order of Magnitude Economics and Scaling
    sections:
      - file: chapters/order_of_magnitude_economics_and_scaling/orders_of_magnitude
      - file: chapters/order_of_magnitude_economics_and_scaling/static_scale
      - file: chapters/order_of_magnitude_economics_and_scaling/dynamic_scale
