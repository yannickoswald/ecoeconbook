name: deploy-book
on:
  push:
    branches: [main, mikhail]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: mikhail
          path: mikhail
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "jupyter-book==1.0.4.post1"
      - name: Build main
        run: |
          jupyter-book build main
          test -f main/_build/html/index.html || { echo "::error::main build produced no index.html"; exit 1; }
      - name: Build mikhail
        run: |
          jupyter-book build mikhail
          test -f mikhail/_build/html/index.html || { echo "::error::mikhail build produced no index.html"; exit 1; }
      - name: Assemble combined site
        run: |
          mkdir -p site
          cp -r main/_build/html/. site/
          mkdir -p site/mikhail
          cp -r mikhail/_build/html/. site/mikhail/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4